<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kofi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#faf7f2;--card:#fff;--ink:#1f1b16;--mute:#7a7266;--line:#e8e1d6;--acc:#d9822b}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
  #app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .logo{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
  header h1{font-size:18px;margin:0}
  header p{margin:0;font-size:13px;color:var(--mute)}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:85%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
  .k{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
  .u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;max-height:140px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:10px 14px;font:inherit}
  textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
  #go{background:var(--acc);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
  #go:disabled{opacity:.5}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">K</div>
    <div><h1>Kofi</h1><p>Your friendly problem-solving buddy</p></div>
  </header>
  <div id="log"></div>
  <form id="f">
    <textarea id="t" rows="1" placeholder="Tell Kofi what's on your mind..."></textarea>
    <button id="go" type="submit" aria-label="Send">&#10148;</button>
  </form>
</div>

<script>
  const log = document.getElementById("log");
  const t = document.getElementById("t");
  const go = document.getElementById("go");
  let history = [];
  let busy = false;

  function add(cls, text) {
    const d = document.createElement("div");
    d.className = "m " + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    add("u", text);
    history.push({ role: "user", content: text });
    t.value = ""; t.style.height = "auto";
    busy = true; go.disabled = true;
    const bubble = add("k", "Kofi is thinking…");

    let msgs = history.slice(-20);
    while (msgs.length && msgs[0].role !== "user") msgs.shift();

    try {
      // No key here. Your own server (api/chat.js) adds it.
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages: msgs })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      bubble.textContent = data.reply;
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      bubble.textContent = "Sorry, something went wrong: " + err.message;
      history.pop();
    }
    busy = false; go.disabled = false; t.focus();
  }

  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); send(t.value); });
  t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(t.value); } });
  t.addEventListener("input", () => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; });

  add("k", "Hey, I'm Kofi! 👋 Tell me what you're trying to figure out, big or small, and we'll sort it out together.");
</script>
</body>
</html>
