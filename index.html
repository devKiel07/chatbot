<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kofi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#faf7f2;--card:#fff;--ink:#1f1b16;--mute:#7a7266;--line:#e8e1d6;--acc:#d9822b;--code:#1e1e1e}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
  #app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .logo{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
  header h1{font-size:18px;margin:0}
  header p{margin:0;font-size:13px;color:var(--mute)}
  header #hbtn{margin-left:auto}
  .ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:90%;padding:10px 14px;border-radius:18px;word-wrap:break-word}
  .k{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
  .u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
  .k ul{margin:6px 0;padding-left:22px}
  .k code{background:#f1ece3;padding:1px 5px;border-radius:4px;font-size:.92em}
  .code{margin:8px 0;border-radius:10px;overflow:hidden;background:var(--code)}
  .code .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:#2d2d2d;color:#bbb;font-size:12px}
  .code button{background:none;border:1px solid #555;color:#ddd;border-radius:6px;font-size:12px;padding:2px 8px;cursor:pointer}
  .code pre{margin:0;padding:10px 12px;overflow-x:auto}
  .code pre code{background:none;color:#eaeaea;padding:0;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
  .card{margin-top:8px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fffaf2}
  .ct{font-weight:600;margin-bottom:2px}
  .sub{font-size:12px;color:var(--mute);margin-bottom:6px}
  .wxnow{display:flex;align-items:center;gap:12px}
  .wxnow .big{font-size:40px;line-height:1}
  .wxnow .t{font-size:34px;font-weight:700}
  .days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .day{text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 4px;background:var(--card);font-size:13px}
  .day b{display:block}
  .tr .lbl{font-size:12px;color:var(--mute);margin-top:6px}
  .tr .big{font-size:20px;font-weight:600}
  .tr button{margin-top:8px}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;max-height:140px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:10px 14px;font:inherit}
  textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
  #go{background:var(--acc);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
  #go:disabled{opacity:.5}
  #app{position:relative}
  #hist{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column}
  #hist[hidden]{display:none}
  #hist .top{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
  #hist .top h2{margin:0;font-size:18px;flex:1}
  #hl{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
  .hrow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
  .hrow.on{border-color:var(--acc)}
  .htitle{flex:1;text-align:left;background:none;border:0;padding:4px;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
  .htitle b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hnote{padding:8px 16px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">K</div>
    <div><h1>Kofi</h1><p>Problems, code, languages and live info</p></div>
    <button class="ghost" id="hbtn" type="button">History</button>
    <button class="ghost" id="clr" type="button">New chat</button>
  </header>
  <section id="hist" hidden aria-label="Chat history">
    <div class="top">
      <h2>Chat history</h2>
      <button class="ghost" id="hclear" type="button">Clear all</button>
      <button class="ghost" id="hclose" type="button">Close</button>
    </div>
    <div id="hl"></div>
    <div class="hnote">Chats are saved only in this browser on this device. Don't use history on a shared computer.</div>
  </section>
  <div id="log"></div>
  <form id="f">
    <textarea id="t" rows="1" placeholder="Ask Kofi anything..."></textarea>
    <button id="go" type="submit" aria-label="Send">&#10148;</button>
  </form>
</div>

<script>
  const log = document.getElementById("log");
  const t = document.getElementById("t");
  const go = document.getElementById("go");
  let history = [], busy = false;

  // ---------- small helpers ----------
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const S = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const fmt = v => Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : String(Math.round(v * 10) / 10);
  const copy = (text, btn) => { navigator.clipboard.writeText(text).then(() => { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = o, 1200); }); };

  // ---------- text rendering (bold, inline code, lists, code blocks) ----------
  function inline(parent, text) {
    text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g).forEach(p => {
      if (!p) return;
      if (p.length > 4 && p.startsWith("**") && p.endsWith("**")) parent.appendChild(el("strong", "", p.slice(2, -2)));
      else if (p.length > 2 && p.startsWith("`") && p.endsWith("`")) parent.appendChild(el("code", "", p.slice(1, -1)));
      else parent.appendChild(document.createTextNode(p));
    });
  }
  function codeBlock(parent, lang, code) {
    const box = el("div", "code"), bar = el("div", "bar"), btn = el("button", "", "Copy");
    btn.type = "button"; btn.onclick = () => copy(code, btn);
    bar.appendChild(el("span", "", lang || "code")); bar.appendChild(btn);
    const pre = el("pre"), c = el("code", "", code); pre.appendChild(c);
    box.appendChild(bar); box.appendChild(pre); parent.appendChild(box);
  }
  function renderText(parent, text) {
    text.split("```").forEach((seg, i) => {
      if (i % 2 === 1) {
        const nl = seg.indexOf("\n");
        const lang = nl > -1 ? seg.slice(0, nl).trim() : "";
        codeBlock(parent, lang, (nl > -1 ? seg.slice(nl + 1) : seg).replace(/\n$/, ""));
        return;
      }
      let ul = null;
      seg.split("\n").forEach(line => {
        const li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
        if (li) { if (!ul) { ul = el("ul"); parent.appendChild(ul); } const l = el("li"); inline(l, li[1]); ul.appendChild(l); return; }
        ul = null;
        if (!line.trim()) { parent.appendChild(el("div", "", "\u00a0")).style.height = "6px"; return; }
        const d = el("div"); inline(d, line); parent.appendChild(d);
      });
    });
  }

  // ---------- cards ----------
  const icon = s => /thunder/.test(s) ? "⛈️" : /snow/.test(s) ? "❄️" : /rain|drizzle|shower/.test(s) ? "🌧️" : /fog/.test(s) ? "🌫️" : /overcast/.test(s) ? "☁️" : /partly/.test(s) ? "⛅" : "☀️";

  function weatherCard(c) {
    const card = el("div", "card");
    card.appendChild(el("div", "ct", c.place));
    const now = el("div", "wxnow");
    now.appendChild(el("div", "big", icon(c.now.sky)));
    now.appendChild(el("div", "t", Math.round(c.now.temp) + "°C"));
    now.appendChild(el("div", "sub", c.now.sky + " · wind " + Math.round(c.now.wind) + " km/h"));
    card.appendChild(now);
    const days = el("div", "days");
    c.days.forEach(d => {
      const x = el("div", "day");
      x.appendChild(el("b", "", new Date(d.date + "T00:00").toLocaleDateString(undefined, { weekday: "short" })));
      x.appendChild(document.createTextNode(Math.round(d.high) + "° / " + Math.round(d.low) + "°"));
      x.appendChild(el("div", "sub", "Rain " + (d.rain == null ? "-" : d.rain) + "%"));
      days.appendChild(x);
    });
    card.appendChild(days);
    return card;
  }

  function chartCard(c) {
    const card = el("div", "card");
    card.appendChild(el("div", "ct", c.title));
    if (c.unit) card.appendChild(el("div", "sub", c.unit));
    const W = 320, H = 190, L = 38, R = 10, T = 14, B = 34, pw = W - L - R, ph = H - T - B;
    const svg = S("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": c.title });
    const vals = c.values, n = vals.length;
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (c.kind === "bar") { lo = Math.min(0, lo); hi = Math.max(0, hi); }
    else { const p = (hi - lo || 1) * 0.1; lo -= p; hi += p; }
    if (hi === lo) hi = lo + 1;
    const y = v => T + (hi - v) / (hi - lo) * ph;
    for (let i = 0; i <= 3; i++) {
      const v = lo + (hi - lo) * i / 3, yy = y(v);
      const g = S("line", { x1: L, x2: W - R, y1: yy, y2: yy }); g.style.stroke = "var(--line)"; svg.appendChild(g);
      const tx = S("text", { x: L - 4, y: yy + 3, "text-anchor": "end", "font-size": 9 }); tx.style.fill = "var(--mute)"; tx.textContent = fmt(v); svg.appendChild(tx);
    }
    const step = pw / n, cx = i => L + step * i + step / 2;
    if (c.kind === "bar") {
      const bw = Math.min(36, step * 0.6);
      vals.forEach((v, i) => {
        const r = S("rect", { x: cx(i) - bw / 2, y: Math.min(y(v), y(0)), width: bw, height: Math.max(1, Math.abs(y(0) - y(v))), rx: 3 });
        r.style.fill = "var(--acc)"; svg.appendChild(r);
        if (n <= 12) { const vt = S("text", { x: cx(i), y: Math.min(y(v), y(0)) - 3, "text-anchor": "middle", "font-size": 9 }); vt.style.fill = "var(--ink)"; vt.textContent = fmt(v); svg.appendChild(vt); }
      });
    } else {
      const pl = S("polyline", { points: vals.map((v, i) => cx(i) + "," + y(v)).join(" "), fill: "none", "stroke-width": 2.5, "stroke-linejoin": "round" });
      pl.style.stroke = "var(--acc)"; svg.appendChild(pl);
      vals.forEach((v, i) => { const d = S("circle", { cx: cx(i), cy: y(v), r: 3.5 }); d.style.fill = "var(--acc)"; svg.appendChild(d); });
    }
    const every = Math.ceil(n / 8);
    c.labels.forEach((lb, i) => {
      if (i % every) return;
      const tx = S("text", { x: cx(i), y: H - B + 14, "text-anchor": "middle", "font-size": 9 }); tx.style.fill = "var(--mute)";
      tx.textContent = lb.length > 9 ? lb.slice(0, 8) + "…" : lb; svg.appendChild(tx);
    });
    card.appendChild(svg);
    return card;
  }

  function translationCard(c) {
    const card = el("div", "card tr");
    card.appendChild(el("div", "lbl", c.from));
    card.appendChild(el("div", "", c.original));
    card.appendChild(el("div", "lbl", c.to));
    card.appendChild(el("div", "big", c.translation));
    if (c.pronunciation) card.appendChild(el("div", "sub", "Say it: " + c.pronunciation));
    const b = el("button", "ghost", "Copy translation"); b.type = "button"; b.onclick = () => copy(c.translation, b);
    card.appendChild(b);
    return card;
  }

  function renderCards(parent, cards) {
    (cards || []).forEach(c => {
      if (c.type === "weather") parent.appendChild(weatherCard(c));
      else if (c.type === "chart") parent.appendChild(chartCard(c));
      else if (c.type === "translation") parent.appendChild(translationCard(c));
    });
  }

  // ---------- chat ----------
  function add(cls, text) {
    const d = el("div", "m " + cls);
    if (text != null) d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    return d;
  }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    add("u", text);
    history.push({ role: "user", content: text });
    t.value = ""; t.style.height = "auto";
    busy = true; go.disabled = true;
    const bubble = add("k", "Kofi is thinking…");
    let msgs = history.slice(-20).map(m => ({ role: m.role, content: m.content }));
    while (msgs.length && msgs[0].role !== "user") msgs.shift();
    try {
      const res = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages: msgs }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      bubble.textContent = "";
      renderText(bubble, data.reply || "");
      renderCards(bubble, data.cards);
      history.push({ role: "assistant", content: data.reply || "(card shown)", cards: data.cards || [] });
      saveCur();
    } catch (err) {
      bubble.textContent = "Sorry, something went wrong: " + err.message;
      history.pop();
    }
    log.scrollTop = log.scrollHeight;
    busy = false; go.disabled = false; t.focus();
  }

  // ---------- saved chats (stored in this browser only) ----------
  const KEY = "kofi_chats";
  let chats = [], cur = null;
  try { chats = JSON.parse(localStorage.getItem(KEY) || "[]"); if (!Array.isArray(chats)) chats = []; } catch (e) { chats = []; }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(chats.slice(0, 30))); } catch (e) {} }

  function saveCur() {
    if (!cur || !cur.msgs.length) return;
    const first = cur.msgs.find(m => m.role === "user");
    cur.title = first ? first.content.slice(0, 50) : "New chat";
    cur.updated = Date.now();
    chats = [cur, ...chats.filter(c => c.id !== cur.id)].slice(0, 30);
    persist();
  }

  function reset() {
    cur = { id: Date.now().toString(36), title: "New chat", updated: Date.now(), msgs: [] };
    history = cur.msgs;
    log.textContent = "";
    add("k", "Hey, I'm Kofi! 👋 Ask me about anything: problems, code, languages, weather or live info. I can show charts and cards too.");
  }

  function openChat(id) {
    const c = chats.find(x => x.id === id);
    if (!c) return;
    cur = c; history = c.msgs; log.textContent = "";
    history.forEach(m => {
      if (m.role === "user") add("u", m.content);
      else { const b = add("k"); renderText(b, m.content === "(card shown)" ? "" : m.content); renderCards(b, m.cards); }
    });
    showHist(false);
    log.scrollTop = log.scrollHeight;
  }

  function drawHist() {
    const list = document.getElementById("hl");
    list.textContent = "";
    if (!chats.length) { list.appendChild(el("div", "sub", "No saved chats yet. Talk to Kofi and your chats will show up here.")); return; }
    chats.forEach(c => {
      const r = el("div", "hrow" + (cur && c.id === cur.id ? " on" : ""));
      const b = el("button", "htitle"); b.type = "button";
      b.appendChild(el("b", "", c.title));
      b.appendChild(el("span", "sub", new Date(c.updated).toLocaleString()));
      b.onclick = () => openChat(c.id);
      const d = el("button", "ghost", "Delete"); d.type = "button";
      d.onclick = () => { chats = chats.filter(x => x.id !== c.id); persist(); if (cur && cur.id === c.id) reset(); drawHist(); };
      r.appendChild(b); r.appendChild(d); list.appendChild(r);
    });
  }

  function showHist(on) { document.getElementById("hist").hidden = !on; if (on) drawHist(); }
  document.getElementById("hbtn").onclick = () => showHist(true);
  document.getElementById("hclose").onclick = () => showHist(false);
  document.getElementById("hclear").onclick = () => { if (confirm("Delete all saved chats?")) { chats = []; persist(); reset(); drawHist(); } };

  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); send(t.value); });
  t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(t.value); } });
  t.addEventListener("input", () => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; });
  document.getElementById("clr").onclick = reset;
  reset();
</script>
</body>
</html>
